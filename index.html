<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finals Frequency · Lo-Fi Countdown</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2a1830;color:#fff6e6;
  font-family:"SF Pro Rounded","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 52% 48%,transparent 52%,rgba(50,25,20,.5) 100%)}
.grade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,170,90,.03),rgba(80,30,60,.06));mix-blend-mode:soft-light}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay}
.glass{background:rgba(34,20,38,.52);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,214,160,.22);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}

#top{position:fixed;top:3vh;left:2vw;width:min(94vw,370px);padding:12px 16px 12px;text-align:center}
.title{font-weight:800;letter-spacing:.42em;font-size:clamp(13px,1.6vw,17px);color:#ffc26b;margin-right:-.42em}
.sub{font-size:10px;opacity:.7;letter-spacing:.08em;margin-top:2px}
#clock{display:flex;justify-content:center;align-items:flex-start;gap:clamp(4px,.9vw,10px);margin:8px 0 4px}
.unit{text-align:center}
.card{position:relative;background:linear-gradient(#412a4a,#2b1a33);border-radius:12px;min-width:1.5em;padding:.1em .12em;
  font-size:clamp(28px,3vw,40px);font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;perspective:600px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.3);overflow:hidden}
.card::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(0,0,0,.35)}
.num{display:block;transform-origin:50% 50%;color:#fff1d6;text-shadow:0 0 18px rgba(255,170,80,.45)}
.flip-out{animation:fo .18s ease-in forwards}.flip-in{animation:fi .22s ease-out}
@keyframes fo{to{transform:rotateX(-90deg);opacity:0}}
@keyframes fi{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-top:4px}
.sep{font-size:clamp(20px,2.4vw,30px);font-weight:800;color:#ffb454;padding-top:.14em;opacity:.8;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#quote{font-size:13px;min-height:1.3em;opacity:.92;transition:opacity .5s;font-style:italic}
#quote.fade{opacity:0}
#goodluck{font-size:clamp(28px,5vw,52px);font-weight:800;color:#ffd27a;padding:12px 0;text-shadow:0 0 24px rgba(255,170,80,.6);animation:pop 1.2s ease-in-out infinite alternate}
@keyframes pop{to{transform:scale(1.06)}}
#chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.chip{background:rgba(255,255,255,.09);border:1px solid rgba(255,214,160,.2);border-radius:999px;padding:4px 10px;font-size:11px;white-space:nowrap}
.chip b{color:#ffd27a;margin-left:4px}.chip.done{opacity:.5}

#bottom{position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);width:min(94vw,860px);padding:8px}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.exam{background:rgba(255,255,255,.07);border:1px solid rgba(255,214,160,.18);border-radius:12px;padding:6px 10px;transition:all .4s}
.exam .code{font-size:10px;letter-spacing:.14em;font-weight:700;color:#ffc26b}
.exam .name{font-size:13px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam .when{display:none}
.exam .cd{font-size:12px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.exam.next{background:rgba(255,160,50,.24);border-color:#ffb454;box-shadow:0 0 22px rgba(255,160,50,.35)}
.exam.next .cd{color:#ffd27a}
.exam.live{background:rgba(120,220,150,.18);border-color:#8fe0a8}
.exam.done{opacity:.45}

.hit{fill:rgba(255,226,170,0);stroke:none;cursor:pointer;transition:fill .2s,stroke .2s}
.hit:hover{fill:rgba(255,226,170,.16);stroke:rgba(255,236,196,.85);stroke-width:3}
.dotg{cursor:pointer}
#tools{position:fixed;right:12px;top:10px;display:flex;gap:8px;align-items:center;z-index:12}
.tbtn{background:rgba(36,20,40,.55);border:1px solid rgba(255,214,160,.3);color:#fff1d6;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tbtn:hover{background:rgba(255,160,50,.3)}
#pomo{display:none}

#info.show{display:flex}
#info .box{position:relative;width:min(92vw,430px);max-height:80vh;overflow:auto;padding:22px 22px 20px;background:rgba(40,22,44,.84)}
#info h2{font-size:20px;margin-bottom:10px;color:#ffd27a}
#info p{font-size:14px;line-height:1.5;margin:8px 0;opacity:.95}
#info .x{position:absolute;right:12px;top:10px;background:none;border:0;color:#fff1d6;font-size:24px;cursor:pointer;line-height:1}
.btn{background:#ff9d33;color:#2b1a33;border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;margin:4px 6px 4px 0}
.btn.alt{background:rgba(255,255,255,.14);color:#fff1d6}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff1d6;text-align:center;margin:6px 0}
.small{font-size:12px;opacity:.7}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;margin:10px 0}
.cal span{padding:6px 0;border-radius:8px;background:rgba(255,255,255,.05)}
.cal .h{background:none;opacity:.6;font-size:11px}
.cal .ex{background:#ff9d33;color:#2b1a33;font-weight:800}
.cal .ev{background:rgba(255,194,107,.3);font-weight:700}
.ck{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer}
.ck input{accent-color:#ff9d33;width:16px;height:16px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb454,#ff8f6b);width:0;transition:width .3s}
input[type=range]{width:100%;accent-color:#ff9d33}

@media (orientation:portrait){
  #top{top:21vh;left:50%;transform:translateX(-50%);padding:9px 12px}
  #top .sub,#top #chips{display:none}
  #bottom{bottom:1.2vh;padding:8px}
  #cards{grid-template-columns:1fr;gap:5px}
  .exam{display:grid;grid-template-columns:1fr auto;column-gap:8px;align-items:center;padding:5px 12px}
  .exam .code,.exam .name{grid-column:1;margin:0}
  .exam .cd{grid-column:2;grid-row:1/3;margin:0;text-align:right}
  #chipsB{display:flex!important}
}
#chipsB{display:none;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:7px}
@media (max-height:620px) and (orientation:landscape){#top .sub,#top #chips{display:none}}

/* panels + active states */
#dock{position:fixed;z-index:30;left:2vw;top:calc(3vh + var(--topH,250px) + 12px);width:min(340px,92vw);max-height:calc(100vh - var(--topH,250px) - 3vh - 124px);overflow:auto;padding:18px 18px 16px;display:none;background:rgba(40,22,44,.88)}
#dock.show{display:block}
#dock h2{font-size:18px;margin:0 28px 8px 0;color:#ffd27a}
#dock p{font-size:13.5px;line-height:1.5;margin:7px 0;opacity:.95}
#dock .x{position:absolute;right:8px;top:6px;background:none;border:0;color:#fff1d6;font-size:26px;cursor:pointer;line-height:1;padding:4px 8px}
#dock .x:hover{color:#ffb454}
.tbtn.active,.exam.active,.chip.active{outline:2px solid #ffb454;box-shadow:0 0 0 4px rgba(255,180,84,.22),0 0 18px rgba(255,160,50,.45);background-color:rgba(255,160,50,.28)}
.exam,.chip,#clock,#quote,.tbtn{cursor:pointer}
#clock:hover .card{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 18px rgba(255,170,80,.45)}
#clock.active .card{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 2px #ffb454,0 0 18px rgba(255,170,80,.5)}
#quote.active{color:#ffd27a}
#quote:hover{opacity:1;text-decoration:underline dotted}
.hit.active{fill:rgba(255,226,170,.18);stroke:rgba(255,236,196,.9);stroke-width:3}
#track.playing::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#7be08f;margin-right:6px;animation:blink 1.2s infinite}
@media (orientation:portrait){
  #dock{left:2vw;right:2vw;width:auto;top:auto;bottom:1.2vh;max-height:33vh}
  #tools{flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
  #tools .tbtn{padding:5px 9px;font-size:11px}
}
#dof{position:fixed;inset:0;pointer-events:none;z-index:2;backdrop-filter:blur(2.6px);-webkit-backdrop-filter:blur(2.6px);-webkit-mask-image:radial-gradient(ellipse 62% 62% at 46% 55%,transparent 55%,#000 100%);mask-image:radial-gradient(ellipse 62% 62% at 46% 55%,transparent 55%,#000 100%)}
</style>
</head>

 notebook:{t:'📚 Prep checklist',html:function(){var h='<div class="bar"><i id="pb"></i></div><p class="small" id="pt"></p>';
   exams.forEach(function(x,i){h+='<p><b>'+x.name+'</b></p>'+checklistHTML(i);});return h;},

   bindChecks(b,u);u();}},
 window:{t:'🪟 Eye break (20-20-20)',html:function(){return '<p>Every 20 minutes, look at something about 20 feet away for 20 seconds. It gives your eyes a rest from close-up reading.</p><div class="big" id="eb">20</div><div style="text-align:center"><button class="btn" id="ebg">Start 20-second break</button></div>';},

   var t=dhms(x.sd-n);e.textContent=t.d+'d '+t.h+'h '+t.m+'m';

miles.forEach(function(m,i){INFO['mile'+i]={t:m.icon+' '+m.label,html:function(){var d=daysTo(m.date),toF=Math.round((target-new Date(m.date+'T12:00:00-08:00'))/864e5);
  return '<p>'+m.full+'</p><p class="small">'+m.nice+'</p><div class="big" style="font-size:30px">'+(d<0?'Done ✓':d===0?'Today!':d+' day'+(d===1?'':'s')+' left')+'</div>'+
  (toF>0?'<p>That leaves about <b>'+toF+' days</b> between this and your first final.</p>':'<p class="small">This falls after your finals start.</p>')+
  (i===2?'<p class="small">A finish line to look forward to. Finals are over by then.</p>':'');}};});

var dock=$('dock'),current=null;
function markActive(id){document.querySelectorAll('[data-panel],[data-id]').forEach(function(e){var k=e.getAttribute('data-panel')||e.getAttribute('data-id');e.classList.toggle('active',!!id&&(k===id||(id==='track'&&k==='music')||(id==='music'&&k==='track')));});}
function openInfo(id){var d=INFO[id];if(!d)return;current=id;dock.querySelector('h2').textContent=d.t;var b=dock.querySelector('.body');b.innerHTML=d.html();if(d.init)d.init.call(d,b);
  dock.classList.add('show');fit();markActive(id);}
function closeInfo(){current=null;dock.classList.remove('show');markActive(null);}
function toggleInfo(id){current===id?closeInfo():openInfo(id);}
dock.querySelector('.x').onclick=closeInfo;
addEventListener('keydown',function(e){if(e.key==='Escape')closeInfo();if((e.key==='f'||e.key==='F')&&!/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))toggleFS();
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('data-panel')&&e.target.tagName==='DIV'){e.preventDefault();toggleInfo(e.target.getAttribute('data-panel'));}});
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-panel],[data-id]');if(!t||t.id==='mute'||t.id==='fs')return;
  if(dock.contains(t))return;var id=t.getAttribute('data-panel')||t.getAttribute('data-id');if(INFO[id])toggleInfo(id);});
function toggleFS(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}
$('fs').onclick=function(e){e.stopPropagation();toggleFS();};
document.addEventListener('fullscreenchange',function(){$('fs').classList.toggle('active',!!document.fullscreenElement);setTimeout(fit,100);});

/* ---------- main tick ---------- */
function tick(){
  var now=new Date(),diff=target-now;
  if(diff<=0){if(!finished){finished=true;$('clock').innerHTML='<div id="goodluck">Good luck! 🎶</div>';}}
  else{var t=dhms(diff);setVal($('d'),pad(t.d));setVal($('h'),pad(t.h));setVal($('m'),pad(t.m));setVal($('s'),pad(t.s));}
  var nextSet=false;
  exams.forEach(function(x){x.el.classList.remove('next','live','done');
   if(now>=x.ed){x.el.classList.add('done');x.cd.textContent='Done ✓';}
   else if(now>=x.sd){x.el.classList.add('live');x.cd.textContent='In progress';}
   else{var t=dhms(x.sd-now);x.cd.textContent=t.d+'d '+t.h+'h '+t.m+'m';}
   if(!nextSet&&now<x.ed){x.el.classList.add('next');nextSet=true;}});
  miles.forEach(function(mi){var n=daysTo(mi.date),txt=n<0?'Done ✓':(n===0?'Today!':(n===1?'1 day left':n+' days left'));
   mi.els.forEach(function(c){c.classList.toggle('done',n<0);c.querySelector('b').textContent=txt;});});
  var p=ptNow();
  $('sHand').setAttribute('transform','rotate('+(p.s*6)+' 1500 350)');
  $('mHand').setAttribute('transform','rotate('+((p.m+p.s/60)*6)+' 1500 350)');
  $('hHand').setAttribute('transform','rotate('+(((p.h%12)+p.m/60)*30)+' 1500 350)');
  pomoTick();if(spin)spin.playbackRate=music.paused?0:1;
  var bar=Math.floor((performance.now()-T0)/3000);$('track').textContent='🎵 Lo-fi · '+CHORDNAME[bar%8];
  if(current&&INFO[current].tick)INFO[current].tick.call(INFO[current],dock.querySelector('.body'));
}
(function loop(){tick();setTimeout(loop,1000-(Date.now()%1000)+5);})();
